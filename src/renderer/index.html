<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws:"
    />
    <title>Poppy</title>
    <link rel="stylesheet" href="./buddy.css" />
  </head>
  <body>
    <!-- The chat is one big speech balloon coming from Poppy. Every pencil piece is cut from the
         user's picture (docs/design/chat-window.jpg): the balloon is Poppy's speech bubble, stretched. -->
    <section id="panel" class="panel" hidden aria-label="Chat with Poppy">
      <header id="panel-head" class="head">
        <button id="settings" class="icon" type="button" aria-label="Settings" title="Settings">
          <img src="../../assets/chat/gear.png" alt="" draggable="false" />
        </button>
        <button id="menu" class="icon" type="button" aria-label="Menu" title="Menu">
          <img src="../../assets/chat/menu.png" alt="" draggable="false" />
        </button>
        <button id="hide" class="icon" type="button" aria-label="Hide Poppy" title="Hide Poppy">
          <img src="../../assets/chat/minimize.png" alt="" draggable="false" />
        </button>
        <button id="close" class="icon" type="button" aria-label="Close chat" title="Close chat">
          <img src="../../assets/chat/close.png" alt="" draggable="false" />
        </button>
      </header>
      <div id="log" class="log" aria-live="polite"></div>
      <div id="attachments" class="attachments" aria-label="Attached files"></div>
      <button id="attach" class="attach" type="button">attach</button>
      <div id="drop" class="drop" hidden>drop to attach</div>
      <form id="form" class="composer">
        <label class="field">
          <input id="input" autocomplete="off" spellcheck="true" placeholder="Ask Poppy anything" />
        </label>
        <button id="send" class="send" type="submit" aria-label="Send">
          <img src="../../assets/chat/send.png" alt="" draggable="false" />
        </button>
      </form>
    </section>
    <div id="bubble" class="bubble" hidden></div>
    <div id="poppy" class="poppy"><div class="shadow"></div></div>
    <img id="label" class="label" alt="" draggable="false" />
    <script type="module" src="./buddy.ts"></script>
  </body>
</html>
