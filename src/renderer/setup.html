<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws:"
    />
    <title>Poppy setup</title>
    <link rel="stylesheet" href="./header.css" />
    <link rel="stylesheet" href="./settings.css" />
    <link rel="stylesheet" href="./setup.css" />
  </head>
  <body>
    <!-- Same paper window as settings: every pencil piece is cut from docs/design/chat-window.jpg,
         and she is her own drawing from the emotion sheets (never redrawn). -->
    <div class="window">
      <div class="paper"></div>
      <header class="art-header head">
        <img src="../../assets/chat/header.png" alt="Poppy" draggable="false" />
        <button id="minimize" class="hot min" type="button" aria-label="Close setup" title="Close setup"></button>
        <button id="close" class="hot close" type="button" aria-label="Close setup" title="Close setup"></button>
        <span class="hot gear inert" aria-hidden="true"></span>
        <span class="hot menu inert" aria-hidden="true"></span>
      </header>

      <main class="scroll">
        <p id="step-of" class="hint step-of"></p>
        <h1 id="title"></h1>

        <div id="say" class="say" aria-live="polite"></div>
        <!-- She stands under the balloon's tail; the list flows around her. -->
        <div class="me">
          <img id="pose" class="pose" alt="" draggable="false" />
          <img id="label" class="label" alt="" draggable="false" />
        </div>

        <div id="body" class="body"></div>

        <div id="work" class="work" hidden>
          <p id="work-text" class="hint"></p>
          <div class="bar"><span id="work-bar"></span></div>
        </div>

      </main>
      <div class="row nav">
        <button id="back" class="btn" type="button">Back</button>
        <span class="grow"></span>
        <button id="next" class="btn" type="button">Next</button>
      </div>
    </div>
    <script type="module" src="./setup.ts"></script>
  </body>
</html>
